<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>폴더 트리 추출기</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6778;
      --line: #d7ddd6;
      --paper: #f4f1ea;
      --panel: #fffdf8;
      --folder: #9ad0ad;
      --file: #c5d7ea;
      --accent: #c45c26;
      --header: #243447;
      --ok: #2f6f4e;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    header {
      background: var(--header);
      color: #f3efe6;
      padding: 18px 24px 16px;
    }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: #c9d2c8; font-size: 13px; line-height: 1.5; }

    .wrap {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100% - 78px);
    }
    aside, main { min-height: 0; overflow: auto; }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
    }
    main { padding: 16px 20px 24px; }

    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
    }
    textarea {
      min-height: 88px;
      resize: vertical;
      font-family: Consolas, "D2Coding", monospace;
      font-size: 12px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .checks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0 0 12px; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #e8ece4; color: var(--ink); }
    .btn-ok { background: var(--ok); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .path-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: Consolas, "D2Coding", monospace;
      font-size: 13px;
      word-break: break-all;
    }
    .stats { color: var(--muted); font-size: 13px; margin-bottom: 6px; }

    .tree-panel {
      background: #1b2420;
      color: #d7e3d4;
      border-radius: 12px;
      padding: 10px 8px;
      overflow: auto;
      min-height: 360px;
      max-height: calc(100vh - 220px);
      font-family: Consolas, "D2Coding", monospace;
      font-size: 13px;
      line-height: 1.45;
    }
    .empty { color: #8aa08a; padding: 8px; }
    .tree-line {
      white-space: pre;
      padding: 1px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tree-line:hover { background: rgba(255,255,255,.06); }
    .tree-line.selected { background: rgba(196, 92, 38, .32); color: #fff; }
    .dir { color: var(--folder); }
    .file { color: var(--file); cursor: default; }

    #fileInput { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>폴더 트리 추출기</h1>
    <p>하위 폴더를 지정하면 그 경로의 파일과 계층을 트리로 만들고, TXT 또는 엑셀로 저장합니다. HTML과 JavaScript만 사용합니다.</p>
  </header>

  <div class="wrap">
    <aside>
      <p class="hint">브라우저 보안상 경로 글자만으로는 디스크를 읽지 못합니다. 폴더를 선택하거나, 이미 있는 경로 목록을 붙여넣으세요. 트리에서 폴더를 클릭하면 그 하위만 지정됩니다.</p>

      <div class="row field">
        <button class="btn-primary" id="pickBtn" type="button">폴더 선택</button>
        <button class="btn-secondary" id="sampleBtn" type="button">예시 불러오기</button>
        <input id="fileInput" type="file" webkitdirectory directory multiple />
      </div>

      <div class="field">
        <label for="folderSelect">지정할 하위 폴더</label>
        <select id="folderSelect">
          <option value="">(선택된 폴더 전체)</option>
        </select>
      </div>

      <div class="field">
        <label for="rootFilter">또는 경로 직접 입력</label>
        <input id="rootFilter" type="text" placeholder="예: 영업관리/수주관리/수주등록" />
      </div>

      <div class="field">
        <label for="maxDepth">최대 깊이 (비우면 전체)</label>
        <input id="maxDepth" type="text" inputmode="numeric" placeholder="예: 4" />
      </div>

      <div class="field checks">
        <label><input id="showDirs" type="checkbox" checked /> 폴더 포함</label>
        <label><input id="showFiles" type="checkbox" checked /> 파일 포함</label>
      </div>

      <div class="field">
        <label for="excludes">제외할 폴더/파일 이름</label>
        <textarea id="excludes">node_modules
.git
dist
build
coverage
.DS_Store</textarea>
      </div>

      <div class="field">
        <label for="pasteBox">경로 목록 붙여넣기 (선택)</label>
        <textarea id="pasteBox" placeholder="dir /s /b 또는 find 결과를 한 줄에 하나씩"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn-secondary" id="pasteBtn" type="button">붙여넣은 경로로 만들기</button>
        </div>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div>
          <div class="stats" id="stats">아직 폴더가 없습니다.</div>
          <div class="path-box" id="selectedPath">지정 경로: (없음)</div>
        </div>
        <div class="row">
          <button class="btn-secondary" id="resetBtn" type="button" disabled>지정 해제</button>
          <button class="btn-secondary" id="copyBtn" type="button" disabled>트리 복사</button>
          <button class="btn-ok" id="txtBtn" type="button" disabled>TXT 저장</button>
          <button class="btn-primary" id="xlsBtn" type="button" disabled>엑셀 저장</button>
        </div>
      </div>
      <div class="tree-panel" id="treeView">
        <div class="empty">왼쪽에서 폴더를 선택하면 트리가 여기에 표시됩니다. 폴더 줄을 클릭하면 그 하위만 내보냅니다.</div>
      </div>
    </main>
  </div>

  <script>
    const SAMPLE_PATHS = [
      "pages/영업관리/수주관리/수주등록/DSA001.jsx",
      "pages/영업관리/수주관리/수주등록/DSA001/constants/searchFields.js",
      "pages/영업관리/수주관리/수주등록/DSA001/hook/useDsa001.js",
      "pages/영업관리/수주관리/수주등록/DSA001/molecule/SearchForm.jsx",
      "pages/영업관리/수주관리/수주등록/DSA001/molecule/GridPanel.jsx",
      "pages/영업관리/수주관리/수주등록/DSA002.jsx",
      "pages/영업관리/수주관리/수주등록/DSA002/constants/columns.js",
      "pages/영업관리/수주관리/수주등록/DSA002/hook/useDsa002.js",
      "pages/영업관리/수주관리/수주등록/DSA002/molecule/SearchForm.jsx",
      "pages/영업관리/수주관리/수주조회/DSB001.jsx",
      "pages/영업관리/수주관리/수주조회/DSB001/constants/searchFields.js",
      "pages/영업관리/수주관리/수주조회/DSB001/tabs/기본/constants/gridColumns.js",
      "pages/영업관리/수주관리/수주조회/DSB001/tabs/기본/molecule/MainGrid.jsx",
      "pages/영업관리/수주관리/수주조회/DSB001/tabs/이력/constants/gridColumns.js",
      "pages/공통/코드관리/코드등록/CMA001.jsx",
      "pages/공통/코드관리/코드등록/CMA001/constants/formFields.js"
    ];

    const state = {
      allEntries: [],
      rootName: "",
      selectedSubpath: "",
      viewRoot: null,
      rows: [],
      text: "",
      syncing: false
    };

    const $ = (id) => document.getElementById(id);

    function splitPath(path) {
      return String(path || "").replace(/\\/g, "/").replace(/^\/+|\/+$/g, "").split("/").filter(Boolean);
    }

    function excludeSet() {
      return new Set($("excludes").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean));
    }

    function uniqueEntries(entries) {
      const map = new Map();
      entries.forEach((entry) => {
        const key = entry.type + ":" + entry.path;
        if (!map.has(key)) map.set(key, entry);
      });
      return Array.from(map.values());
    }

    function inferRoot(paths) {
      return splitPath(paths[0] || "")[0] || "root";
    }

    function entriesFromPaths(paths) {
      const excludes = excludeSet();
      const files = [];
      const dirs = new Set();
      paths.forEach((raw) => {
        const parts = splitPath(raw);
        if (!parts.length || parts.some((part) => excludes.has(part))) return;
        parts.forEach((_, idx) => {
          const dirParts = parts.slice(0, idx);
          if (dirParts.length) dirs.add(dirParts.join("/"));
        });
        files.push({ path: parts.join("/"), name: parts[parts.length - 1], type: "file" });
      });
      dirs.forEach((path) => {
        const parts = splitPath(path);
        files.push({ path, name: parts[parts.length - 1], type: "dir" });
      });
      return uniqueEntries(files);
    }

    function buildTree(entries, rootName) {
      const root = { name: rootName || "root", path: "", type: "dir", children: new Map() };
      entries.forEach((entry) => {
        const parts = splitPath(entry.path);
        if (rootName && parts[0] === rootName) parts.shift();
        if (!parts.length) return;
        let node = root;
        const acc = [];
        parts.forEach((part, idx) => {
          acc.push(part);
          const isLast = idx === parts.length - 1;
          if (!node.children.has(part)) {
            node.children.set(part, {
              name: part,
              path: acc.join("/"),
              type: isLast ? entry.type : "dir",
              children: new Map()
            });
          }
          node = node.children.get(part);
          if (!isLast) node.type = "dir";
          else node.type = entry.type;
        });
      });
      return root;
    }

    function sortChildren(node) {
      return Array.from(node.children.values()).sort((a, b) => {
        if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
        return a.name.localeCompare(b.name, "ko");
      });
    }

    function normalizeSubpath(subpath, rootName) {
      const parts = splitPath(subpath);
      if (parts[0] === rootName) parts.shift();
      return parts.join("/");
    }

    function findNode(root, subpath) {
      const parts = splitPath(normalizeSubpath(subpath, root.name));
      let node = root;
      for (const part of parts) {
        if (!node.children.has(part)) return null;
        node = node.children.get(part);
      }
      return node;
    }

    function collectDirOptions(node, acc) {
      acc.push({ path: node.path, label: node.path ? node.path : node.name });
      sortChildren(node).forEach((child) => {
        if (child.type === "dir") collectDirOptions(child, acc);
      });
    }

    function maxDepthValue() {
      const raw = $("maxDepth").value.trim();
      if (raw === "") return null;
      const num = Number(raw);
      return Number.isFinite(num) && num >= 0 ? num : null;
    }

    function hasVisible(node, maxDepth, depth, showDirs, showFiles) {
      if (maxDepth !== null && depth > maxDepth) return false;
      if (node.type === "file") return showFiles;
      if (showDirs) return true;
      return sortChildren(node).some((child) => hasVisible(child, maxDepth, depth + 1, showDirs, showFiles));
    }

    function visibleRoot(root) {
      const selected = normalizeSubpath($("rootFilter").value.trim(), root.name);
      state.selectedSubpath = selected;
      if (!selected) return root;
      return findNode(root, selected) || root;
    }

    function flatten(node, depth, maxDepth, showDirs, showFiles, rows) {
      if (maxDepth !== null && depth > maxDepth) return;
      if ((node.type === "dir" && showDirs) || (node.type === "file" && showFiles) || depth === 0) {
        rows.push({ node, depth });
      }
      if (node.type !== "dir") return;
      sortChildren(node).forEach((child) => flatten(child, depth + 1, maxDepth, showDirs, showFiles, rows));
    }

    function walkText(node, prefix, isLast, isRoot, maxDepth, depth, showDirs, showFiles, lines) {
      if (maxDepth !== null && depth > maxDepth) return;
      const print = isRoot || (node.type === "dir" && showDirs) || (node.type === "file" && showFiles);
      if (print) {
        const connector = isRoot ? "" : (isLast ? "└── " : "├── ");
        lines.push({
          text: (isRoot ? node.name : prefix + connector + node.name),
          node,
          depth
        });
      }
      if (node.type !== "dir") return;
      const children = sortChildren(node).filter((child) => hasVisible(child, maxDepth, depth + 1, showDirs, showFiles));
      children.forEach((child, idx) => {
        const last = idx === children.length - 1;
        const nextPrefix = isRoot ? "" : prefix + (isLast ? "    " : "│   ");
        walkText(child, nextPrefix, last, false, maxDepth, depth + 1, showDirs, showFiles, lines);
      });
    }

    function parentPath(path) {
      const parts = splitPath(path);
      parts.pop();
      return parts.join("/");
    }

    function extName(name, type) {
      if (type === "dir") return "";
      const idx = name.lastIndexOf(".");
      return idx > 0 ? name.slice(idx + 1) : "";
    }

    function xmlEscape(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toExcelXml(rows) {
      const headers = ["트리", "이름", "종류", "깊이", "상대경로", "상위경로", "확장자"];
      const header = headers.map((name) =>
        `<Cell ss:StyleID="header"><Data ss:Type="String">${xmlEscape(name)}</Data></Cell>`
      ).join("");
      const body = rows.map(({ node, depth }) => {
        const tree = depth === 0 ? node.name : ("    ".repeat(depth) + "├─ " + node.name);
        const values = [
          tree,
          node.name,
          node.type === "dir" ? "폴더" : "파일",
          String(depth),
          node.path || node.name,
          parentPath(node.path),
          extName(node.name, node.type)
        ];
        const cells = values.map((value, idx) => {
          const type = idx === 3 ? "Number" : "String";
          return `<Cell><Data ss:Type="${type}">${xmlEscape(value)}</Data></Cell>`;
        }).join("");
        return `<Row>${cells}</Row>`;
      }).join("");

      return `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
  <Styles>
    <Style ss:ID="header">
      <Font ss:Bold="1" ss:Color="#FFFFFF"/>
      <Interior ss:Color="#243447" ss:Pattern="Solid"/>
    </Style>
  </Styles>
  <Worksheet ss:Name="폴더트리">
    <Table>
      <Column ss:Width="240"/>
      <Column ss:Width="140"/>
      <Column ss:Width="50"/>
      <Column ss:Width="40"/>
      <Column ss:Width="280"/>
      <Column ss:Width="180"/>
      <Column ss:Width="50"/>
      <Row>${header}</Row>
      ${body}
    </Table>
  </Worksheet>
</Workbook>`;
    }

    function download(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function fileStamp(viewRoot) {
      const safe = (viewRoot.name || "folder").replace(/[\\/:*?"<>|]/g, "_");
      const date = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${safe}_${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}`;
    }

    function fillFolderSelect(root, selected) {
      const options = [];
      collectDirOptions(root, options);
      $("folderSelect").innerHTML = options.map((opt) => {
        const value = opt.path;
        const current = value === selected ? " selected" : "";
        return `<option value="${xmlEscape(value)}"${current}>${xmlEscape(opt.label)}</option>`;
      }).join("");
    }

    function refresh() {
      if (!state.allEntries.length) return;
      const excludes = excludeSet();
      const entries = state.allEntries.filter((entry) => !splitPath(entry.path).some((part) => excludes.has(part)));
      const root = buildTree(entries, state.rootName);
      const viewRoot = visibleRoot(root);
      const maxDepth = maxDepthValue();
      const showDirs = $("showDirs").checked;
      const showFiles = $("showFiles").checked;
      const rows = [];
      flatten(viewRoot, 0, maxDepth, showDirs, showFiles, rows);
      const lines = [];
      walkText(viewRoot, "", true, true, maxDepth, 0, showDirs, showFiles, lines);

      fillFolderSelect(root, state.selectedSubpath);
      $("selectedPath").textContent = "지정 경로: " + (state.selectedSubpath ? (root.name + "/" + state.selectedSubpath) : root.name);
      const dirCount = rows.filter((r) => r.node.type === "dir").length;
      const fileCount = rows.filter((r) => r.node.type === "file").length;
      $("stats").textContent = `폴더 ${dirCount}개 · 파일 ${fileCount}개`;

      const panel = $("treeView");
      panel.innerHTML = "";
      if (!lines.length) {
        panel.innerHTML = '<div class="empty">(표시할 항목이 없습니다)</div>';
      } else {
        lines.forEach((line) => {
          const div = document.createElement("div");
          div.className = "tree-line " + (line.node.type === "dir" ? "dir" : "file");
          if (line.node.path === state.selectedSubpath) div.classList.add("selected");
          div.textContent = line.text;
          div.title = line.node.type === "dir" ? "이 폴더만 지정" : line.node.path;
          if (line.node.type === "dir") {
            div.addEventListener("click", () => {
              state.syncing = true;
              $("rootFilter").value = line.node.path;
              state.syncing = false;
              refresh();
            });
          }
          panel.appendChild(div);
        });
      }

      state.viewRoot = viewRoot;
      state.rows = rows;
      state.text = lines.map((line) => line.text).join("\n");
      $("resetBtn").disabled = !state.allEntries.length;
      $("copyBtn").disabled = !state.text;
      $("txtBtn").disabled = !state.text;
      $("xlsBtn").disabled = !rows.length;
    }

    function loadEntries(entries, rootName, selected) {
      state.allEntries = entries;
      state.rootName = rootName;
      state.syncing = true;
      $("rootFilter").value = selected || "";
      state.syncing = false;
      refresh();
    }

    async function walkDirectory(handle, prefix, bucket) {
      const excludes = excludeSet();
      for await (const [name, child] of handle.entries()) {
        if (excludes.has(name)) continue;
        const path = prefix ? prefix + "/" + name : name;
        if (child.kind === "directory") {
          bucket.push({ path, name, type: "dir" });
          await walkDirectory(child, path, bucket);
        } else {
          bucket.push({ path, name, type: "file" });
        }
      }
    }

    $("pickBtn").addEventListener("click", async () => {
      if (window.showDirectoryPicker) {
        try {
          const handle = await window.showDirectoryPicker();
          const bucket = [];
          await walkDirectory(handle, handle.name, bucket);
          loadEntries(bucket, handle.name, "");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      $("fileInput").click();
    });

    $("fileInput").addEventListener("change", (event) => {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const paths = files.map((file) => file.webkitRelativePath || file.name);
      loadEntries(entriesFromPaths(paths), inferRoot(paths), "");
    });

    $("sampleBtn").addEventListener("click", () => {
      loadEntries(entriesFromPaths(SAMPLE_PATHS), "pages", "");
    });

    $("pasteBtn").addEventListener("click", () => {
      const paths = $("pasteBox").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      if (!paths.length) {
        alert("경로를 한 줄에 하나씩 붙여넣은 다음 다시 눌러주세요.");
        return;
      }
      loadEntries(entriesFromPaths(paths), inferRoot(paths), "");
    });

    $("folderSelect").addEventListener("change", () => {
      state.syncing = true;
      $("rootFilter").value = $("folderSelect").value;
      state.syncing = false;
      refresh();
    });

    ["rootFilter", "maxDepth", "showDirs", "showFiles", "excludes"].forEach((id) => {
      $(id).addEventListener("input", () => { if (!state.syncing) refresh(); });
      $(id).addEventListener("change", () => { if (!state.syncing) refresh(); });
    });

    $("resetBtn").addEventListener("click", () => {
      state.syncing = true;
      $("rootFilter").value = "";
      state.syncing = false;
      refresh();
    });

    $("copyBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(state.text || "");
      $("copyBtn").textContent = "복사됨";
      setTimeout(() => { $("copyBtn").textContent = "트리 복사"; }, 1200);
    });

    $("txtBtn").addEventListener("click", () => {
      download(fileStamp(state.viewRoot) + ".txt", state.text, "text/plain;charset=utf-8");
    });

    $("xlsBtn").addEventListener("click", () => {
      download(fileStamp(state.viewRoot) + ".xls", "\ufeff" + toExcelXml(state.rows), "application/vnd.ms-excel");
    });
  </script>
</body>
</html>
